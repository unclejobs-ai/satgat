name: CI · 웹 제품 계약

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: 린트 · 테스트 · 빌드 · 브라우저/PDF
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Node 환경 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bun 환경 준비
        uses: oven-sh/setup-bun@v2

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      - name: 타입 체크
        run: npx tsc --noEmit

      - name: 단위 테스트
        run: npm test

      - name: 생성 토큰 드리프트 검사
        run: npm run tokens:check

      - name: 14종 카탈로그·런타임 아티팩트 계약
        run: npm run verify:templates

      - name: 디자인 8조 차단 규칙
        run: node scripts/design-guard.mjs --check

      - name: 디자인 밀도 휴리스틱
        run: node scripts/design-guard.mjs --check-density

      - name: 프로덕션 빌드
        run: npm run build
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}

      - name: 브라우저·PDF 제품 계약
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/satgat-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          npm run verify:web
        env:
          SATGAT_APP_ORIGIN: http://127.0.0.1:3000
